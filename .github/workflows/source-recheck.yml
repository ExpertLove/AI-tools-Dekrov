name: Re-check official sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tool_id:
        description: "Exact catalog tool ID to re-check (leave empty for all tools)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: source-recheck-state
  cancel-in-progress: false

jobs:
  recheck:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Locate previous trusted state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'source-recheck.yml',
              branch: context.payload.repository.default_branch, status: 'completed', per_page: 100
            });
            const previous = runs.filter(r => r.id !== context.runId &&
              ['schedule', 'workflow_dispatch'].includes(r.event) &&
              r.repository.id === context.payload.repository.id).sort((a,b) => b.id - a.id)[0];
            if (!previous) return;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: previous.id
            });
            const artifact = data.artifacts.find(a => a.name === 'source-recheck-state-v1' && !a.expired);
            // Never fall back to older history after a missing/failed snapshot.
            if (artifact) core.setOutput('run', String(previous.id));
      - name: Restore previous state
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: source-recheck-state-v1
          path: ${{ runner.temp }}/previous-state
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
      - name: Check declared official sources
        env:
          TOOL_ID: ${{ inputs.tool_id }}
        run: |
          node .github/scripts/recheck-official-sources.mjs \
            --output "$RUNNER_TEMP/source-recheck.json" \
            --state "$RUNNER_TEMP/previous-state/source-recheck-state.json" \
            --state-output "$RUNNER_TEMP/source-recheck-state.json" \
            --tool "$TOOL_ID"
      # Persist before Issue API writes: a failed Issue request must not lose observations.
      - uses: actions/upload-artifact@v4
        with:
          name: source-recheck-state-v1
          path: ${{ runner.temp }}/source-recheck-state.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: source-recheck-report-v2
          path: ${{ runner.temp }}/source-recheck.json
          retention-days: 30
      - name: Ensure maintenance labels exist
        run: node .github/scripts/ensure-labels.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create update or close maintenance Issues
        # Only machine-marked source-recheck / needs-review Issues are managed.
        run: node .github/scripts/apply-source-recheck-issues.mjs --report "$RUNNER_TEMP/source-recheck.json" --output "$RUNNER_TEMP/source-recheck-issues.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Write re-check summary
        run: node .github/scripts/write-source-recheck-summary.mjs --report "$RUNNER_TEMP/source-recheck.json" --issues "$RUNNER_TEMP/source-recheck-issues.json" --summary "$GITHUB_STEP_SUMMARY"
